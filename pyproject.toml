[project]
name = "augury"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "beingglitch", email = "surajshukla5604@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "fastmcp>=4.0.8",
    "langchain>=1.4.0",
    "langchain-community<0.4.2",
    "langchain-openai>=1.6.2",
    "langgraph>=1.2.11",
    "openai>=3.16.2",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "ragas>=0.3.1",
    "sentence-transformers>=6.0.1",
]

[project.scripts]
augury = "augury:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
testpaths=["tests"]
